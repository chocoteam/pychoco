name: Windows

on:
  push:
    branches: [ "master", "dev_actions" ]
    tags: [ '**' ]

jobs:
  build-windows:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os : [windows-2022]
        arch: [x86_64]
        python-version: ["3.11"]
    steps:
      - name: Print system info
        run: echo $(uname -o) $(uname -r) $(uname -m)
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'
      - name: Install setuptools (needed from Python 3.12)
        run: pip install setuptools
      - name: Install Swig
        run: choco install swig
      - name: Build choco-solver-capi
        uses: ./.github/actions/build-choco-solver-capi
        with:
          os: ${{ runner.os }}
          arch: ${{ matrix.arch }}
      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build pychoco
        env:
          DISTUTILS_USE_SDK: "1"
          MSSdk: "1"
        run: |
          sh build.sh nocapibuild nowheel
      - name: Verify build artifacts
        shell: pwsh
        run: |
          Write-Host "--- pychoco/ contents ---"
          Get-ChildItem pychoco/
          Write-Host "--- _backend.pyd anywhere in repo ---"
          Get-ChildItem -Recurse . -Filter "_backend*.pyd" -ErrorAction SilentlyContinue | Select-Object FullName
          Write-Host "--- pychoco importable? ---"
          python -c "import pychoco; print('OK')"
      - name: Test
        run: |
          pip install -U pytest
          pip install -r requirements_tests.txt
          pytest
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_ARCHS: AMD64
        with:
          output-dir: dist
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{matrix.os}}-${{matrix.python-version}}-artifact
          path: dist/
          if-no-files-found: error


  upload-pypi-windows:
    needs: build-windows
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    strategy:
      matrix:
        os : [windows-2022]
        python-version: ["3.11"]
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: wheel-${{matrix.os}}-${{matrix.python-version}}-artifact
        path: dist
    - name: List files
      run: ls -R
    - name: Upload to PyPi
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        verbose: true
        skip-existing: true
